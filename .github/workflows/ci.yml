name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test on Ubuntu
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Cài đặt dependencies (CMake sẽ tự tải GTest)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            wget \
            unzip
      
      # 3. Configure CMake (FetchContent sẽ tự tải GTest)
      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Debug
      
      # 4. Build project
      - name: Build project
        run: |
          cd build
          make -j$(nproc)
      
      # 5. Chạy unit tests (CTest sẽ chạy tất cả test đã đăng ký)
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose
      
      # 6. Upload test logs nếu fail
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/Testing/Temporary/
            build/Testing/*/Test.xml