name: C++ CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test on Ubuntu
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Cài đặt dependencies (Bổ sung thư viện bắt buộc cho Drogon)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            wget \
            unzip \
            libjsoncpp-dev \
            pkg-config \
            uuid-dev \
            zlib1g-dev \
            libssl-dev
      
      # 3. Sử dụng Cache để tránh biên dịch lại Drogon ở mỗi lần chạy CI
      - name: Cache Drogon Framework
        id: cache-drogon
        uses: actions/cache@v4
        with:
          path: ~/drogon_install
          key: ${{ runner.os }}-drogon-cache-v1

      # 4. Tải và cài đặt Drogon nếu chưa có trong Cache
      - name: Build and Install Drogon Framework
        if: steps.cache-drogon.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com
          cd drogon
          git submodule update --init
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=$HOME/drogon_install -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          make install

      # 5. Configure CMake (Truyền đường dẫn Drogon vào CMAKE_PREFIX_PATH)
      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=$HOME/drogon_install
      
      # 6. Build project
      - name: Build project
        run: |
          cmake --build build --config Debug -j$(nproc)
      
      # 7. Chạy unit tests
      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose
      
      # 8. Upload test logs nếu fail
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/Testing/Temporary/
            build/Testing/*/Test.xml
